site_name: GoC Guide Library
site_description: Step-by-step guides from Generals of Chaos, searchable by metadata.
site_url: https://lipford-dutch.github.io/goc-guide-library/
repo_url: https://github.com/Lipford-Dutch/goc-guide-library
repo_name: Lipford-Dutch/goc-guide-library
docs_dir: docs
theme:
  name: material
  font: false
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.tabs.link
extra_css:
  - assets/extra.css
plugins:
  - search
  - tags
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
# guides-nav:start
nav:
  - Home: index.md
  - Guides:
      - "Home Lab Services: Step-by-Step Build Guide": guides/home-lab-services/index.md
      - "This Week’s Top 10 GitHub Repos: Step-by-Step Try-It Guide": guides/top-10-github-repos/index.md
      - "Uncensored AI in 3 Levels: Step-by-Step Guide": guides/uncensored-ai-in-3-levels/index.md
      - "Free DevOps Roadmap: Step-by-Step Study Guide": guides/free-devops-roadmap/index.md
      - "100 Strange Facts, Fact-Checked: A Verification Guide": guides/100-strange-facts-fact-checked/index.md
      - "Full Stack’s Featured Repos, Nov 10–24, 2026: Step-by-Step Try-It Guide": guides/full-stack-featured-repos-nov-2026/index.md
  - Tags: tags.md
# guides-nav:end
